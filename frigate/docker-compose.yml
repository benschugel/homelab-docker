# Frigate NVR with a custom TensorRT image. Run from this folder.
# Project name pinned so the network name stays stable if this folder moves.
# config/ is a bind mount: config.yml is tracked, everything else Frigate writes there is gitignored.

name: frigate

services:
  frigate:
    container_name: frigate
    build:
      context: .
      dockerfile: frigate-trt.Dockerfile
    image: frigate-trt:local
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./config:/config
      - D:/frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    env_file:
      - .env
    environment:
      TZ: "America/Chicago"
      PLUS_API_KEY: "${PLUS_API_KEY}"