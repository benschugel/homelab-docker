# Wazuh MCP Server (https://github.com/gensecaihq/Wazuh-MCP-Server)
# Joins the existing Wazuh single-node compose network so it can reach
# wazuh.manager:55000 and wazuh.indexer:9200 by container hostname.

name: wazuh-mcp

services:
  wazuh-mcp:
    image: ghcr.io/gensecaihq/wazuh-mcp-server:5.0.0
    container_name: wazuh-mcp
    hostname: wazuh-mcp
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env
      - .env.write
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      ENVIRONMENT: production

    ports:
      # Loopback only: reachable from Claude Code on this PC, not from the LAN.
      - "127.0.0.1:3000:3000"

    networks:
      - wazuh

    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:3000/health | jq -e '.status == \"healthy\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./config:/app/config:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/logs:noexec,nosuid,size=128m,uid=1000,gid=1000

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Second instance for Home Assistant's MCP client, which can't send a bearer token.
  # Authless and read-only; reachable only from the HA Green via firewall rules.
  wazuh-mcp-ha:
    image: ghcr.io/gensecaihq/wazuh-mcp-server:5.0.0
    container_name: wazuh-mcp-ha
    hostname: wazuh-mcp-ha
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      ENVIRONMENT: production
      AUTH_MODE: none
      AUTHLESS_ALLOW_WRITE: "false"

    ports:
      # LAN IP only; Windows Firewall and UniFi limit it to the HA Green.
      - "192.168.10.10:3001:3000"

    networks:
      - wazuh

    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:3000/health | jq -e '.status == \"healthy\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./config:/app/config:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/logs:noexec,nosuid,size=128m,uid=1000,gid=1000

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wazuh:
    external: true
    name: single-node_default
