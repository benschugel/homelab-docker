services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    labels:
      # Auto-updated nightly by the watchtower stack (opt-in).
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "3002:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:
