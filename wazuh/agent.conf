  <agent_config os="Windows">
    <!-- Default queue of 5000 events overflowed every time the manager
         restarted (Sysmon + event channel backlog). 2026-10-07 -->
    <client_buffer>
      <disabled>no</disabled>
      <queue_size>50000</queue_size>
      <events_per_second>1000</events_per_second>
    </client_buffer>
    <syscheck>
      <directories realtime="yes" check_all="yes">C:\Users\*\Downloads</directories>
      <!-- Claude Desktop's MCP server configuration. The desktop's local
           ossec.conf already watches these two paths in realtime; this
           entry repeats them with report_changes so the alert shows what
           changed. Rule 100262 keeps the modifications at level 3. 2026-10-10 -->
      <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="0" restrict="claude_desktop_config.json$">C:\Users\*\AppData\Local\Packages\Claude_*\LocalCache\Roaming\Claude</directories>
      <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="0" restrict="claude_desktop_config.json$">C:\Users\*\AppData\Roaming\Claude</directories>
      <!-- W32Time rewrites these keys on every clock sync, which fired rules
           594 and 750 several times a day and fed the VirusTotal queue.
           The agents report HKLM\System as [x32]; arch="both" also covers a
           64-bit view. The RunTime subkey is listed in case the parent entry
           is matched exactly rather than as a prefix. 2026-10-08 -->
      <registry_ignore arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\SecureTimeLimits</registry_ignore>
      <registry_ignore arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\SecureTimeLimits\RunTime</registry_ignore>
      <registry_ignore arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient</registry_ignore>
    </syscheck>
  </agent_config>
